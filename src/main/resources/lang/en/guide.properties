guide.p2.title=Why go to the base
guide.p2.text=• On the base, clan blocks can't be broken with one hit: they have lots of HP.\n\n• If you die outside the base, you lose some of your items.\n\n• When you log out, your body stays in the world. A body outside its base can be found with a compass and killed.
guide.p3.title=What's at the base
guide.p3.heart=The heart
guide.p3.text=\ (right-click) opens the clan menu: emerald treasury, energy, members, invitations.\n\n• Chests and crafting stations are protected.\n\n• Collectors bring in resources from the region.
guide.p4.title=The compass
guide.p4.text=Right-click with the compass to open its menu.\n\n• "Clan guide": this book.\n• "Compass to base": point the arrow back at the heart.\n• Bodies, clans, cargo weight, events and the website map.\n\nOn the right of your screen: where you are standing, your weight and the chunk's energy.
