guide.p2.title=Почему на базу
guide.p2.text=• На базе блоки клана не ломаются с одного удара: у них много HP.\n\n• Вне базы при смерти теряется часть вещей.\n\n• Когда вы выходите из игры, ваше тело остаётся в мире. Чужое тело вне базы можно найти компасом и убить.
guide.p3.title=Что на базе
guide.p3.heart=Сердце
guide.p3.text=\ (ПКМ) — меню клана: казна с изумрудами, энергия, участники, приглашения.\n\n• Сундуки и станции крафта под защитой.\n\n• Сборщики ресурсов приносят добычу региона.
guide.p4.title=Компас
guide.p4.text=ПКМ компасом — меню.\n\n• «Гайд клана» — эта книга.\n• «Компас на базу» — снова навести стрелку на сердце.\n• Тела, кланы, вес груза, ивенты и сайт с картой.\n\nСправа на экране — где вы стоите, вес и энергия чанка.
guide.book-title=Гайд клана
